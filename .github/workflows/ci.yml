name: CI

on:
  push:
    branches: ["feat/scaling-benchmarks"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scaling-benchmarks
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "style: format Phase 2 benchmark sources"
          git push origin HEAD:feat/scaling-benchmarks
