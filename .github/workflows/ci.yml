name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test explicit measurement lifecycle
        run: cargo test -p ardosia-loadgen --test child_protocol --test bidirectional --test workload --test send_error_policy
      - name: Test workspace
        run: cargo test --workspace
