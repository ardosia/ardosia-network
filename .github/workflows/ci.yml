name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Repository branch, tag, or commit to verify
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: manual-network-ci-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Require private-repository token
        shell: bash
        env:
          ARDOSIA_REPO_TOKEN: ${{ secrets.ARDOSIA_REPO_TOKEN }}
        run: |
          if [[ -z "${ARDOSIA_REPO_TOKEN}" ]]; then
            echo "::error::Missing ARDOSIA_REPO_TOKEN with read-only access to private Ardosia sibling repositories."
            exit 1
          fi

      - name: Check out pinned private RakNet dependency
        uses: actions/checkout@v4
        with:
          repository: ardosia/ardosia-raknet
          ref: f127fce27a206a51a1d39ffa7a9bbed98d10ea14
          path: _deps/ardosia-raknet
          token: ${{ secrets.ARDOSIA_REPO_TOKEN }}

      - name: Override RakNet Git dependency with checked-out source
        shell: bash
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          paths = ["${GITHUB_WORKSPACE}/_deps/ardosia-raknet"]
          EOF

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked
