name: CI

on:
  push:
    branches: ["feat/scaling-benchmarks"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run focused Task 7 tests
        run: cargo test -p ardosia-loadgen --test report --test child_protocol --test bidirectional
