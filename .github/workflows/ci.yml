name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run sampling regression
        run: cargo test -p ardosia-loadgen sampling::tests::steady_interval_waits_one_full_period_before_first_tick -- --nocapture
      - name: Run measurement-boundary regression
        run: cargo test -p ardosia-loadgen --test bidirectional one_client_moves_every_workload_class_both_directions_and_measures_rtt -- --nocapture
