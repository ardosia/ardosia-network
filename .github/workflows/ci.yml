name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run scaling scenario parser test
        run: cargo test -p ardosia-loadgen --test scenario checked_in_scaling_scenarios_parse_and_match_expected_shapes
