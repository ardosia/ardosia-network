name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Probe Cargo lock refresh
        run: |
          cargo update
          echo '--- CARGO LOCK DIFF ---'
          git diff -- Cargo.lock
          echo '--- END CARGO LOCK DIFF ---'
          exit 1
