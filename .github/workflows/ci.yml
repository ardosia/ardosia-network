name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Smoke local child process
        run: |
          cat > /tmp/ardosia-task5.toml <<'EOF'
          name = "task5-child-smoke"
          clients = 1
          protocol_version = 8
          ramp_up_seconds = 0
          hold_seconds = 1
          connect_timeout_seconds = 2
          seed = 1
          EOF
          cargo run -p ardosia-loadgen -- local /tmp/ardosia-task5.toml --bind 127.0.0.1:19143
      - name: Test vendored RakNet library
        run: cargo test --manifest-path vendor/raknet-rust/Cargo.toml --lib
