name: Format protocol84 network branch

on:
  push:
    branches:
      - feat/protocol84-transport-profile

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Persist formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: rustfmt protocol84 network branch"
            git push
          fi
