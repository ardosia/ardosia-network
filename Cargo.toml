[workspace]
members = [
    "crates/ardosia-network",
    "crates/ardosia-loadgen",
]
exclude = ["vendor/raknet-rust"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
bytes = "1.8"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "process", "io-util", "io-std", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
raknet-rust = { path = "vendor/raknet-rust" }

[profile.profiling]
inherits = "release"
debug = 1
strip = false
