[workspace]
members = [
    "crates/ardosia-network",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
bytes = "1.8"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "process", "io-util", "io-std", "fs"] }
raknet-rust = { git = "https://github.com/ardosia/ardosia-raknet", rev = "a9f2f262d4028ba5028e9e6f11bfd0831244b9c8" }
